name: Temperaturkonverter CI/CD

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Anwendung testen
    runs-on: ubuntu-latest

    steps:
      - name: Repository-Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python-Pakete zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Anwendung paketieren
        run: |
          mkdir -p build
          python -m zipfile -c build/temperatur-konverter.zip src/ README.md requirements.txt
      - name: Anwendungspaket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: temperatur-konverter-paket
          path: build/temperatur-konverter.zip
          if-no-files-found: error
