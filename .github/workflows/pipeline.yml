name: Temperaturkonverter CI/CD

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: Anwendung testen
    runs-on: ubuntu-latest

    steps:
      - name: Repository-Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python-Pakete zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m pytest -v

      - name: Anwendung paketieren
        run: |
          mkdir -p build
          python -m zipfile -c build/temperatur-konverter.zip src/ README.md requirements.txt
      - name: Anwendungspaket hochladen
        uses: actions/upload-artifact@v4
        with:
          name: temperatur-konverter-paket
          path: build/temperatur-konverter.zip
          if-no-files-found: error
  deploy:
    name: Geschütztes Deployment vorbereiten
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Anwendungspaket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: temperatur-konverter-paket
          path: build/

      - name: Paket prüfen
        run: |
          ls -lh build/
          python -m zipfile -l build/temperatur-konverter.zip

      - name: Deployment-Ziel anzeigen
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
        run: |
          echo "Deployment-Ziel: $DEPLOY_TARGET"

      - name: Übungs-Secret prüfen
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Fehler: DEPLOY_TOKEN fehlt."
            exit 1
          fi
          echo "Übungs-Secret vorhanden; sein Wert wird nicht ausgegeben."
      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: v1.0.${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_VERSION" \
            build/temperatur-konverter.zip \
            --target "$RELEASE_COMMIT" \
            --title "Temperaturkonverter $RELEASE_VERSION" \
            --notes "Automatisch veröffentlicht nach erfolgreichen Tests und Environment-Freigabe."
